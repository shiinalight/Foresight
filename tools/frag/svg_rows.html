  <figcaption>Left: error of the most likely point. Right: coverage of the 5% to 95% box. The orange line is only the local TabPFN-3.5-Fast arm (1 estimator, up to 2,000 rows): on 2,000 rows (0.646 m) it is about as accurate as LightGBM on 20,000 (0.634 m). LightGBM on all 73,163 rows reaches 0.606 m. Not drawn: TabPFN-3.5 on the hosted API, which on 20,000 rows reaches 0.593 m (pinball 0.096, coverage 87%), the best of all (table below). TabPFN's coverage stays near 85% at every size; LightGBM needs 10,000 to 20,000 rows to approach the target.</figcaption>
