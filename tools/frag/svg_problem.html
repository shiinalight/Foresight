<figure>
  <div class="fig">
  <svg viewBox="0 0 640 290" role="img" aria-label="A robot facing three people with predicted boxes; the straight move is rejected, an upward move is chosen">
    <rect x="0" y="0" width="640" height="290" rx="6" class="floor"/>
    <!-- person 1 walking down into the robot's path -->
    <circle cx="292" cy="60" r="4" class="hist"/><circle cx="296" cy="75" r="4" class="hist"/>
    <circle cx="300" cy="92" r="9" class="p-dot"/>
    <line x1="300" y1="104" x2="303" y2="128" class="arrow"/>
    <rect x="262" y="132" width="78" height="62" rx="3" class="p-box"/>
    <!-- person 2 walking up-left -->
    <circle cx="452" cy="262" r="4" class="hist"/><circle cx="440" cy="252" r="4" class="hist"/>
    <circle cx="425" cy="240" r="9" class="p-dot"/>
    <line x1="415" y1="231" x2="398" y2="216" class="arrow"/>
    <rect x="352" y="168" width="62" height="56" rx="3" class="p-box"/>
    <!-- person 3 standing -->
    <circle cx="470" cy="66" r="9" class="p-dot"/>
    <rect x="452" y="48" width="36" height="36" rx="3" class="p-box"/>
    <!-- candidate moves -->
    <line x1="90" y1="170" x2="282" y2="162" class="mv-no"/>
    <line x1="90" y1="170" x2="262" y2="236" class="mv-ok"/>
    <line x1="90" y1="170" x2="250" y2="104" class="mv-pick"/>
    <circle cx="90" cy="170" r="16" class="r-dot"/>
    <text x="90" y="205" class="tk" text-anchor="middle">robot</text>
    <polygon points="592,140 596,152 609,152 599,159 603,171 592,164 581,171 585,159 575,152 588,152" class="star"/>
    <text x="592" y="188" class="tk" text-anchor="middle">goal</text>
    <text x="180" y="150" class="tl" text-anchor="middle" fill="var(--bad)" style="fill:var(--bad)">rejected</text>
    <text x="160" y="118" class="tl" text-anchor="middle" style="fill:var(--good)">chosen</text>
  </svg>
  <div class="legend"><span><i style="background:var(--person)"></i>person now (faded dots: last second)</span><span><i style="background:var(--box)"></i>predicted 2 s box</span><span><i style="background:var(--robot)"></i>robot</span><span><i style="background:var(--bad)"></i>move rejected</span><span><i style="background:var(--good)"></i>move allowed</span></div>
  </div>
  <figcaption>Illustration of the idea. The straight line to the goal would pass through the first person's 2 s box, so it is rejected. Among the moves that stay clear, the robot takes the one that makes the most progress.</figcaption>
</figure>
