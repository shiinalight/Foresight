<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last-metre delivery</title>
<style>
  :root {
    --ink: #2b2a28; --muted: #6d6a64; --card: rgba(250, 248, 244, 0.92); --pill: rgba(38, 38, 42, 0.88);
    --accent: #e0603c; --bg1: #8d8b88; --bg2: #5f5e5c;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
    background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg2)); }
  #stage { position: fixed; inset: 0; }
  .card { position: fixed; background: var(--card); border-radius: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
  #info { top: 18px; left: 18px; padding: 14px 18px; min-width: 250px; }
  #info h1 { margin: 0 0 2px; font-size: 20px; letter-spacing: -.01em; }
  #info .sub { color: var(--muted); font-size: 12.5px; }
  #info .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  #clock { font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 650; }
  .phase { font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #e6e1d8; color: var(--ink); }
  .phase.rush { background: var(--accent); color: white; }
  #bar { left: 50%; bottom: 18px; transform: translateX(-50%); width: min(920px, calc(100% - 36px)); padding: 12px 16px 10px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
  button, select { font: inherit; font-size: 13px; border: 0; border-radius: 999px; padding: 7px 13px; background: #ebe6dd; color: var(--ink); cursor: pointer; }
  button.on { background: var(--ink); color: white; }
  #play { width: 40px; height: 40px; padding: 0; font-size: 16px; background: var(--ink); color: white; }
  #track { position: relative; height: 58px; }
  #slider { position: absolute; left: 0; right: 0; bottom: 2px; width: 100%; accent-color: var(--ink); margin: 0; }
  .tick { position: absolute; bottom: 22px; background: var(--card); padding: 0 3px; border-radius: 4px; transform: translateX(-50%); font-size: 11px; white-space: nowrap; color: var(--ink); cursor: pointer; }
  .tick.up { bottom: 38px; }
  .tick.up::after { height: 23px; }
  .tick::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 7px; background: var(--accent); transform: translateX(-50%); }
  .tick b { font-weight: 650; }
  .views { display: flex; gap: 6px; }
  .pill { background: var(--pill); color: white; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,.25); transition: opacity .35s; pointer-events: none; }
  .pill.event { background: var(--accent); font-size: 14px; }
  .pill.robot { background: rgba(38,38,42,.82); font-size: 12px; }
  #banner { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); opacity: 0; font-size: 16px; padding: 8px 16px; }
  #help { right: 18px; top: 18px; padding: 10px 14px; font-size: 12px; color: var(--muted); }
  /* intro: how the prediction works */
  #caption { left: 50%; bottom: 22px; transform: translateX(-50%); width: min(860px, calc(100% - 36px)); padding: 16px 22px; display: none; }
  #caption .step { font-size: 13px; font-weight: 650; color: var(--accent); letter-spacing: .02em; text-transform: uppercase; }
  #caption h2 { margin: 2px 0 6px; font-size: 24px; letter-spacing: -.01em; }
  #caption p { margin: 0; font-size: 16px; color: #46433e; line-height: 1.45; }
  #rows { left: 50%; top: 20px; transform: translateX(-50%); padding: 10px 14px; display: none; font-size: 13px; }
  #rows table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #rows th { font-weight: 600; color: var(--muted); text-align: right; padding: 3px 10px; font-size: 12px; }
  #rows td { text-align: right; padding: 4px 10px; border-top: 1px solid #e6e1d8; }
  #rows th:first-child, #rows td:first-child { text-align: left; }
  #rows tr.me td { background: rgba(224, 96, 60, .14); font-weight: 650; }
  #rows .q { color: var(--accent); font-weight: 700; }
  #tab { right: 26px; top: 50%; transform: translateY(-50%); width: 220px; padding: 18px; display: none; text-align: center; }
  #tab .name { font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
  #tab .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  #tab .count { font-size: 22px; font-weight: 650; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .chip { position: fixed; padding: 3px 8px; border-radius: 6px; background: #f2ede4; border: 1px solid #d8d0c2; font-size: 11px; color: #5a564f; pointer-events: none; white-space: nowrap; }
  #meter { right: 26px; top: 50%; transform: translateY(-50%); width: 240px; padding: 18px; display: none; }
  #meter .big { font-size: 40px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  #meter .lbl { font-size: 13px; color: var(--muted); }
  #meter .barbox { height: 10px; background: #e6e1d8; border-radius: 6px; margin-top: 10px; position: relative; overflow: hidden; }
  #meter .fillbar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 6px; }
  #meter .target { position: absolute; left: 80%; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .pill.card { background: rgba(250,248,244,.96); color: var(--ink); font-weight: 500; font-size: 12.5px; padding: 10px 12px; border-radius: 10px; line-height: 1.55; white-space: normal; width: 220px; box-shadow: 0 6px 20px rgba(0,0,0,.22); }
  .pill.card b { font-weight: 650; }
  .pill.tag { background: rgba(38,38,42,.78); font-size: 11.5px; padding: 3px 8px; font-weight: 600; }
  .pill.blue { background: #2a78d6; }
  /* outro: the evidence */
  #panel { right: 26px; top: 50%; transform: translateY(-50%); width: 470px; padding: 18px 20px; display: none; }
  #panel h3 { margin: 0 0 2px; font-size: 18px; letter-spacing: -.01em; }
  #panel .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  #panel svg { display: block; width: 100%; height: auto; }
  #panel .verdict { margin-top: 10px; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.4; }
  #panel .verdict.yes { background: rgba(27,175,122,.14); }
  #panel .verdict.no { background: #ece7de; }
  #panel .verdict b { display: block; font-size: 14px; margin-bottom: 2px; }
  #panel ul { margin: 6px 0 0; padding-left: 18px; font-size: 14.5px; line-height: 1.55; }
  @media (max-width: 700px) { #help { display: none; } #bar { grid-template-columns: auto 1fr; } .views { grid-column: 1 / -1; justify-content: center; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="stage"></div>
<div id="info" class="card">
  <h1>Last-metre delivery</h1>
  <div class="sub" id="sub"></div>
  <div class="row"><span id="clock">0.0 s</span><span id="phase" class="phase">Normal traffic</span></div>
  <div class="sub" id="stat" style="margin-top:8px"></div>
</div>
<div id="help" class="card">Drag to orbit · right-drag to pan · scroll to zoom</div>
<div id="banner" class="pill event"></div>
<div id="caption" class="card"><div class="step" id="cap-step"></div><h2 id="cap-title"></h2><p id="cap-text"></p></div>
<div id="rows" class="card"></div>
<div id="panel" class="card"></div>
<div id="tab" class="card"><div class="name">TabPFN</div><div class="sub">pretrained on tables, no training here</div><div class="count" id="tab-count">0 rows</div><div class="sub">example rows with known answers</div></div>
<div id="meter" class="card"><div class="lbl">Validation episodes: real positions inside the patch</div><div class="big" id="meter-val">80%</div><div class="barbox"><div class="fillbar" id="meter-bar"></div><div class="target"></div></div><div class="lbl" style="margin-top:8px">patch size <b id="meter-f">×1.00</b> · target 80%</div></div>
<div id="bar" class="card">
  <button id="play" title="Play / pause">❚❚</button>
  <div id="track"><input id="slider" type="range" min="0" max="1" step="0.001" value="0"></div>
  <div class="views">
    <select id="speed" title="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <button data-view="overview" class="on">Overview</button>
    <button data-view="follow">Follow robot</button>
    <button data-view="street">Street level</button>
  </div>
</div>
<script type="application/json" id="data">__DATA__</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const D = JSON.parse(document.getElementById('data').textContent);
const QP = new URLSearchParams(location.search);
const SCENE = D.scene || 'street';                    // 'street' (last-metre delivery) or 'doorway' (bottleneck)
const M = D.map, ACT = D.acts;
const W = D.bounds[2], H = D.bounds[3];             // half sizes (street 20 x 12.5, doorway 8 x 8)
const CURB = M.curb_abs_y ?? 0, WALL = M.wall_abs_y ?? 0, ROAD = M.road ? M.road.y[1] : 0, CX = M.crosswalk ? M.crosswalk.x[1] : 0;
const SIDE_H = 0.15;                                  // sidewalk height
const FLOOR_H = 0.1;                                  // doorway: floor slab height
const groundZ = (type, y) => SCENE === 'doorway' ? FLOOR_H : (Math.abs(y) >= CURB && type !== 'car' && type !== 'cyclist' ? SIDE_H : 0.02);
const TXT = SCENE === 'doorway'
  ? { title: 'Doorway bottleneck', sub: 'Simulated rooms', calm: 'Trickle', rush: 'Rush: meeting ended', eye: 'At the door' }
  : { title: 'Last-metre delivery', sub: 'Simulated street', calm: 'Normal traffic', rush: 'Rush hour', eye: 'Street level' };
document.title = TXT.title;
document.querySelector('#info h1').textContent = TXT.title;
document.getElementById('phase').textContent = TXT.calm;
document.querySelector('[data-view="street"]').textContent = TXT.eye;
document.getElementById('sub').textContent = `${TXT.sub} · episode ${D.episode} · ${D.agents.length} agents`;

// ---------- renderer, scene, camera ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' });
document.body.appendChild(labels.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.48; controls.minDistance = 4; controls.maxDistance = 140;

scene.add(new THREE.HemisphereLight(0xfffaf2, 0x8c8272, 1.25));
const sun = new THREE.DirectionalLight(0xfff1df, 2.3);
sun.position.set(-18, 32, 16); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 24, bottom: -24, near: 1, far: 90 });
sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4;
scene.add(sun);

// sim (x, y) -> world (x, 0, -y): north is away from the default camera
const P = (x, y, z = 0) => new THREE.Vector3(x, z, -y);
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.82, metalness: 0, ...o });
function mesh(geo, material, { x = 0, y = 0, z = 0, cast = true, receive = true } = {}) {
  const m = new THREE.Mesh(geo, material); m.position.set(x, z, -y); m.castShadow = cast; m.receiveShadow = receive; return m;
}
function box(w, d, h, color, x, y, z0 = 0, o = {}) {   // w along x, d along sim y, h up; z0 = bottom
  const m = mesh(new THREE.BoxGeometry(w, h, d), typeof color === 'string' || typeof color === 'number' ? mat(color, o) : color, { x, y, z: z0 + h / 2 });
  scene.add(m); return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function floorText(text, x, y, z, size, color = '#3a3733', { sub = '', dot = null, rot = 0 } = {}) {
  const pxPerM = 90, wM = Math.max(text.length * size * 0.62, sub.length * size * 0.33) + size * (dot ? 0.9 : 0.2), hM = size * (sub ? 1.75 : 1.2);
  const tex = canvasTex(Math.ceil(wM * pxPerM), Math.ceil(hM * pxPerM), (g, w, h) => {
    const s = size * pxPerM, off = dot ? s * 0.7 : 0;
    if (dot) { g.fillStyle = dot; g.beginPath(); g.arc(s * 0.28, s * 0.55, s * 0.17, 0, 7); g.fill(); }
    g.fillStyle = color; g.font = `700 ${s}px system-ui, sans-serif`; g.textBaseline = 'top'; g.fillText(text, off, s * 0.05);
    if (sub) { g.globalAlpha = 0.75; g.font = `500 ${s * 0.42}px system-ui, sans-serif`; g.fillText(sub, off, s * 1.15); }
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wM, hM), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 1, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.rotation.z = rot; m.position.set(x, z + 0.006, -y); m.receiveShadow = true; scene.add(m); return m;
}

// ---------- shared pieces: trees, walls ----------
const trunk = mat('#7a5c45'), leaf = mat('#8fb07a'), leaf2 = mat('#7ea36a'), metal = mat('#3d3f43', { roughness: 0.5, metalness: 0.4 });
function tree(x, y, z0, s = 1) {
  scene.add(mesh(new THREE.CylinderGeometry(0.07 * s, 0.1 * s, 1.1 * s, 8), trunk, { x, y, z: z0 + 0.55 * s }));
  scene.add(mesh(new THREE.SphereGeometry(0.62 * s, 20, 14), leaf, { x, y, z: z0 + 1.45 * s }));
  scene.add(mesh(new THREE.SphereGeometry(0.45 * s, 20, 14), leaf2, { x: x + 0.15 * s, y: y - 0.1 * s, z: z0 + 2.05 * s }));
}
const wallM = mat('#f4f1ea'), wallTop = mat('#6b5847'), glass = new THREE.MeshPhysicalMaterial({ color: '#cfe0e6', transparent: true, opacity: 0.35, roughness: 0.1 });
function wall(x0, y0, x1, y1, h = 1.7, m = wallM, z0 = SIDE_H, thick = 0.2) {
  const len = Math.hypot(x1 - x0, y1 - y0), w = mesh(new THREE.BoxGeometry(len, h, thick), m, { x: (x0 + x1) / 2, y: (y0 + y1) / 2, z: z0 + h / 2 });
  w.rotation.y = Math.atan2(y1 - y0, x1 - x0); scene.add(w);
  const cap = mesh(new THREE.BoxGeometry(len + 0.02, 0.06, thick + 0.04), wallTop, { x: (x0 + x1) / 2, y: (y0 + y1) / 2, z: z0 + h + 0.03 });
  cap.rotation.y = w.rotation.y; scene.add(cap);
}
function tileTex(base, line, n = 8) {
  const t = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h); g.strokeStyle = line; g.lineWidth = 3;
    for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * w / n, 0); g.lineTo(i * w / n, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / n); g.lineTo(w, i * h / n); g.stroke(); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function plankTex() {
  const t = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#dcc6a5'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? 'rgba(120,85,50,.07)' : 'rgba(255,255,255,.06)'; g.fillRect(0, i * h / 16, w, h / 16 - 2); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

if (SCENE === 'doorway') buildDoorway();
else {
// ---------- the model base and the street ----------
box(2 * W + 1.6, 2 * H + 1.6, 0.5, '#6b5847', 0, 0, -0.65);                 // dark trim like a model's plinth
box(2 * W + 1.0, 2 * H + 1.0, 0.5, '#e6e0d5', 0, 0, -0.5);
const tiles = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#e9e4da'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(120,110,95,.18)'; g.lineWidth = 3;
  for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * w / 8, 0); g.lineTo(i * w / 8, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 8); g.lineTo(w, i * h / 8); g.stroke(); }
});
tiles.wrapS = tiles.wrapT = THREE.RepeatWrapping;
for (const s of [1, -1]) {                                                    // raised sidewalks with tiles
  const t = tiles.clone(); t.needsUpdate = true; t.repeat.set(2 * W / 4, (WALL - CURB) / 4);
  box(2 * W, WALL - CURB, SIDE_H, mat('#ffffff', { map: t }), 0, s * (CURB + WALL) / 2);
  box(2 * W, 0.18, SIDE_H + 0.02, '#cfc7b8', 0, s * (CURB + 0.09));            // curb stones
}
box(2 * W, 2 * ROAD, 0.02, '#4b4e54', 0, 0);                                  // asphalt
for (const s of [1, -1]) box(2 * W, CURB - ROAD, 0.025, '#b2674f', 0, s * (ROAD + CURB) / 2);   // bike lanes
for (const s of [1, -1]) box(2 * W, 0.12, 0.03, '#f4f1ea', 0, s * (ROAD - 0.06));                // edge lines
for (let x = -W + 1; x < W; x += 4) if (Math.abs(x + 1) > CX + 1.2) box(2.0, 0.12, 0.03, '#f4f1ea', x + 1, 0);   // centre dashes
for (let y = -CURB + 0.45; y < CURB; y += 1.0) box(2 * CX, 0.5, 0.035, '#fbfaf6', 0, y);           // zebra stripes
box(0.3, ROAD, 0.032, '#fbfaf6', -(CX + 1.0), -ROAD / 2);                      // stop lines
box(0.3, ROAD, 0.032, '#fbfaf6', CX + 1.0, ROAD / 2);
for (const [s, dir] of [[-1, 1], [1, -1]]) {                                  // bike symbols + arrows
  for (const x of [-12, 12]) floorText('BIKE ' + (dir > 0 ? '→' : '←'), x, s * (ROAD + CURB) / 2 - 0.33, 0.03, 0.55, 'rgba(255,255,255,.85)');
}
floorText('Bike lane', -17.5, (ROAD + CURB) / 2 - 0.3, 0.03, 0.5, 'rgba(255,255,255,.9)');
floorText('Zebra crossing', CX + 1.6, -CURB - 0.9, SIDE_H, 0.45, '#5b5750');

// lamp posts and planters with round trees (from the simulation's obstacles)
for (const [x, y, r] of D.obstacles) {
  if (r < 0.3) {
    scene.add(mesh(new THREE.CylinderGeometry(0.06, 0.08, 4.2, 12), metal, { x, y, z: SIDE_H + 2.1 }));
    const arm = mesh(new THREE.BoxGeometry(0.05, 0.05, 0.9), metal, { x, y: y - Math.sign(y) * 0.45, z: SIDE_H + 4.15 }); scene.add(arm);
    scene.add(mesh(new THREE.BoxGeometry(0.35, 0.12, 0.25), mat('#fff3d6', { emissive: '#ffe3a3', emissiveIntensity: 0.6 }), { x, y: y - Math.sign(y) * 0.85, z: SIDE_H + 4.05 }));
  } else {
    box(1.3, 1.3, 0.5, '#b9a58b', x, y, SIDE_H);
    tree(x, y, SIDE_H + 0.5, 1.0);
  }
}

// ---------- buildings: cut-away rooms like an architect's model ----------
function room(b, floor, doorW = b.door_width ?? 1.8) {
  const [x0, x1] = b.x, [y0, y1] = b.y, s = Math.sign(y0 + y1);      // s: +1 north side, -1 south side
  const front = s > 0 ? y0 : y1, back = s > 0 ? y1 : y0, dx = b.door[0];
  box(x1 - x0, y1 - y0, 0.04, floor, (x0 + x1) / 2, (y0 + y1) / 2, SIDE_H);
  wall(x0, back, x1, back); wall(x0, y0, x0, y1); wall(x1, y0, x1, y1);
  wall(x0, front, dx - doorW / 2, front, 0.55); wall(dx + doorW / 2, front, x1, front, 0.55);   // low street front ...
  for (const [a, c] of [[x0, dx - doorW / 2], [dx + doorW / 2, x1]]) {                       // ... with glass above
    const g = mesh(new THREE.BoxGeometry(c - a, 1.1, 0.05), glass, { x: (a + c) / 2, y: front, z: SIDE_H + 0.55 + 0.55, cast: false }); scene.add(g);
  }
  return { x0, x1, y0, y1, s, front, back };
}
const planks = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#dcc6a5'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? 'rgba(120,85,50,.07)' : 'rgba(255,255,255,.06)'; g.fillRect(0, i * h / 16, w, h / 16 - 2); }
});
planks.wrapS = planks.wrapT = THREE.RepeatWrapping; planks.repeat.set(3, 1.5);
const cafe = room(M.buildings.find(b => b.name.startsWith('Caf')), mat('#ffffff', { map: planks }));
const station = room(M.buildings.find(b => b.name === 'Station'), mat('#d9dad6'));
// café furniture
const wood = mat('#b58c62'), white = mat('#f7f5f0'), dark = mat('#3b3a38');
box(4.2, 0.8, 1.0, white, cafe.x0 + 3.2, cafe.back - 0.8, SIDE_H);                          // counter

const agents = D.agents.map(a => {

  v.eventLabel = new CSS2DObject(el); v.eventLabel.position.set(0, a.type === 'car' ? 2.4 : a.type === 'robot' ? 2.2 : 2.6, 0); v.g.add(v.eventLabel);

const byId = new Map(agents.map(v => [v.data.id, v]));

// ---------- predictions (optional): the model's 80% range at +h s under each agent ----------
// rows: [agent_id, frame, x0, y0, x1, y1, x2, y2, x3, y3, true_x, true_y, inside]
const PRED = D.pred || null;
if (PRED) {
  const per = new Map();
  for (const r of PRED.rows) { if (!per.has(r[0])) per.set(r[0], []); per.get(r[0]).push(r); }
  const fillM = new THREE.MeshBasicMaterial({ color: '#eb6834', transparent: true, opacity: 0.3, depthWrite: false, side: THREE.DoubleSide });
  const edgeM = new THREE.LineBasicMaterial({ color: '#c4471c' });
  const trueM = new THREE.MeshBasicMaterial({ color: '#26262a' });
  for (const [aid, rows] of per) {
    const v = byId.get(aid); if (!v) continue;
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(12), 3)); g.setIndex([0, 1, 2, 0, 2, 3]);
    const eg = new THREE.BufferGeometry(); eg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(15), 3));
    const fill = new THREE.Mesh(g, fillM), edge = new THREE.Line(eg, edgeM);
    const mark = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.05, 8, 24), trueM); mark.rotation.x = -Math.PI / 2;
    fill.renderOrder = 2; scene.add(fill, edge, mark); fill.visible = edge.visible = mark.visible = false;
    v.pred = { fill, edge, mark, rows };
  }
  document.getElementById('sub').textContent += ' · held-out episode (never trained on)';
}
function drawPred(v, f) {
  const p = v.pred; let r = null;
  for (const x of p.rows) { if (x[1] <= f + 1e-6) r = x; else break; }
  const show = predShow === 'all' && !!r && f - r[1] < PRED.every + 0.01 && v.g.visible;
  p.fill.visible = p.edge.visible = p.mark.visible = show;
  if (!show) return;
  const z = (y) => groundZ(v.data.type, y) + 0.05, pos = p.fill.geometry.attributes.position.array, e = p.edge.geometry.attributes.position.array;
  for (let i = 0; i < 5; i++) {
    const j = i % 4, x = r[2 + 2 * j], y = r[3 + 2 * j];
    if (i < 4) { pos[3 * i] = x; pos[3 * i + 1] = z(y); pos[3 * i + 2] = -y; }

    card.visible = s === 2 && ls > 2;
    rowsEl.style.display = s === 2 && ls > 4.5 ? 'block' : 'none';
    // step 3
    ghost.g.visible = ghostTag.visible = s === 3;
    if (s === 3) { const g = ease(Math.min(1, ls / 4)) * 0 + Math.min(1, ls / 4);
      ghost.g.position.copy(W(F0.x + (IN.cv[0] - F0.x) * g, F0.y + (IN.cv[1] - F0.y) * g)); ghost.g.rotation.y = h0;
      const sw = ls < 4 ? Math.sin(ls * 5.5) * 0.5 : 0; ghost.legs[0].rotation.z = sw; ghost.legs[1].rotation.z = -sw; ghost.arms[0].rotation.z = -sw * 0.8; ghost.arms[1].rotation.z = sw * 0.8;
      ghostTag.position.copy(ghost.g.position).add(new THREE.Vector3(0, 2.4, 0)); }
    corr.visible = corrTag.visible = s === 3 && ls > 4.2;
    // step 4
    tabEl.style.display = s === 4 ? 'block' : 'none';
    tabCount.textContent = `${Math.round(IN.n_ctx * ease((it - 29) / 3)).toLocaleString('en')} rows`;
    const tb = tabEl.getBoundingClientRect();
    chips.forEach(c => { const p = (it - c.d) / 0.9; c.el.style.display = s === 4 && p > 0 && p < 1 ? 'block' : 'none';
      if (p > 0 && p < 1) { c.el.style.left = `${20 + (tb.left + 40 - 20) * ease(p)}px`; c.el.style.top = `${c.y0 + (tb.top + tb.height / 2 - c.y0) * ease(p)}px`; c.el.style.opacity = 1 - p * 0.6; } });
    pts.forEach((P_, i) => { P_.m.visible = (s === 4 && ls > 4 + i * 0.4) || s === 5; P_.tag.visible = s === 4 && ls > 4 + i * 0.4; });
    const fade = s === 4 ? ease((ls - 6) / 1.5) : s === 5 ? 1 : 0;
    pFill.visible = pEdge.visible = fade > 0; pFill.material.opacity = 0.3 * fade; patchTag.visible = s === 4 && ls > 6.5;
    truthRing.visible = (s === 4 && ls > 7.5) || s === 5; truthTag.visible = s === 4 && ls > 7.5;
    // step 5
    meterEl.style.display = s === 5 ? 'block' : 'none';
    const fz = s === 5 && ls < 6 ? 1 + 0.55 * Math.sin(2 * Math.PI * ls / 3) * (1 - ls / 6) : 1;
    setPatch(s === 5 ? fz : 1);
    if (s === 5) { const c = cover(fz); mVal.textContent = `${Math.round(100 * c)}%`; mBar.style.width = `${100 * c}%`; mF.textContent = `×${fz.toFixed(2)}`; }
    // trees turn see-through while the camera looks past them (steps 3-5)
    const ghostly = s >= 3 && s <= 5;
    for (const m of [leaf, leaf2, trunk]) { m.transparent = true; m.opacity = ghostly ? 0.15 : 1; m.depthWrite = !ghostly; }
    // step 6: every agent's patch
    predShow = s === 6 ? 'all' : 'none';
    fv.g.visible = fv.g.visible && true;
  };
  introEnd = () => {
    introOn = false; ui(true); controls.enabled = true; predShow = 'all';
    for (const m of [leaf, leaf2, trunk]) { m.opacity = 1; m.depthWrite = true; }
    [...dots, track, vArrow, vTag, dotTag, card, ghost.g, ghostTag, corr, corrTag, pFill, pEdge, patchTag, truthRing, truthTag,
     ...links.flatMap(L => [L.line, L.tag]), ...pts.flatMap(p => [p.m, p.tag])].forEach(o => o.visible = false);
    for (const id of ['rows', 'tab', 'meter']) document.getElementById(id).style.display = 'none';
    chips.forEach(c => c.el.style.display = 'none');
    t = 0; playing = true; playBtn.textContent = '❚❚'; setView('overview');
  };
}

// ---------- outro (?outro): the evidence, over the same street ----------
// Numbers come from results/evidence.json (D.evidence) and, for Test 1's close-up, from each model's
// +2 s box for the intro's pedestrian, sized on validation exactly as in the evidence run (PRED.compare).
const EVD = D.evidence, FD = PRED && PRED.intro, CMP = PRED && PRED.compare;
const OUTRO = !!(EVD && FD && CMP && QP.has('outro') && !IN);
let outroOn = OUTRO, outT = QP.has('ot') ? +QP.get('ot') : 0, outPaused = OUTRO && QP.has('pause');
const OL = [0, 4, 14, 22, 30, 37, 44, 48];
let outroUpdate = () => {}, outroSceneT = () => 0;
if (OUTRO) {
  const C_TAB = '#eb6834', C_LGB = '#2a78d6', C_LG2 = '#1baf7a', C_CV = '#9a958c';
  const f2 = (x, d = 2) => Number(x).toFixed(d), pc = x => `${Math.round(100 * x)}%`;
  const T1 = EVD.t1, T3 = EVD.t3, REAL = EVD.real;
  const best = s => ['lgbm_all', 'lgbm_same'].reduce((a, m) => REAL[s][m]['2'][0] < REAL[s][a]['2'][0] ? m : a, 'lgbm_all');
  const svgBars = (items, max, unit) => {
    const W_ = 430, rowH = 38, H_ = items.length * rowH + 10, x0 = 150, w = W_ - x0 - 64;
    return `<svg viewBox="0 0 ${W_} ${H_}">` + items.map((it, i) => { const y = 6 + i * rowH, bw = Math.max(2, w * it.v / max);
      return `<text x="${x0 - 10}" y="${y + 16}" text-anchor="end" font-size="13" fill="#2b2a28">${it.label}</text>`
        + (it.sub ? `<text x="${x0 - 10}" y="${y + 30}" text-anchor="end" font-size="11" fill="#6d6a64">${it.sub}</text>` : '')
        + `<rect x="${x0}" y="${y + 4}" width="${bw}" height="20" rx="4" fill="${it.c}"/>`
        + `<text x="${x0 + bw + 8}" y="${y + 19}" font-size="13" font-weight="650" fill="#2b2a28">${f2(it.v, it.d ?? 1)} ${unit}</text>`; }).join('') + '</svg>';
  };
  const svgLines = (series, o) => {
    const W_ = 430, H_ = 230, L = 46, R = 132, T = 14, B = 34, xs = series.flatMap(s => s.pts.map(p => p[0])), ys = series.flatMap(s => s.pts.flatMap(p => [p[1] - (p[2] || 0), p[1] + (p[2] || 0)]));
    const tx = o.log ? Math.log10 : (v => v), x0 = tx(Math.min(...xs)), x1 = tx(Math.max(...xs));
    const y0 = o.ymin ?? Math.min(...ys) * 0.95, y1 = Math.max(...ys) * 1.03;
    const X = v => L + (tx(v) - x0) / (x1 - x0) * (W_ - L - R), Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H_ - T - B);
    let g = '';
    for (const yv of o.yticks) g += `<line x1="${L}" x2="${W_ - R}" y1="${Y(yv)}" y2="${Y(yv)}" stroke="#e6e1d8"/><text x="${L - 6}" y="${Y(yv) + 4}" text-anchor="end" font-size="11" fill="#6d6a64">${f2(yv, 1)}</text>`;
    for (const xv of o.xticks) g += `<text x="${X(xv)}" y="${H_ - B + 16}" text-anchor="middle" font-size="11" fill="#6d6a64">${o.xfmt ? o.xfmt(xv) : xv}</text>`;
    if (o.vline != null) g += `<line x1="${X(o.vline)}" x2="${X(o.vline)}" y1="${T}" y2="${H_ - B}" stroke="#2b2a28" stroke-dasharray="4 4"/><text x="${X(o.vline) + 5}" y="${T + 11}" font-size="11" fill="#2b2a28">${o.vlabel}</text>`;
    g += `<text x="${(L + W_ - R) / 2}" y="${H_ - 2}" text-anchor="middle" font-size="11.5" fill="#6d6a64">${o.xlabel}</text>`;
    g += `<text x="12" y="${T + (H_ - T - B) / 2}" transform="rotate(-90 12 ${T + (H_ - T - B) / 2})" text-anchor="middle" font-size="11.5" fill="#6d6a64">${o.ylabel}</text>`;
    const used = [];
    for (const s of series) {
      for (const p of s.pts) if (p[2]) g += `<line x1="${X(p[0])}" x2="${X(p[0])}" y1="${Y(p[1] - p[2])}" y2="${Y(p[1] + p[2])}" stroke="${s.c}" stroke-width="1.5"/>`;
      g += `<polyline fill="none" stroke="${s.c}" stroke-width="2.4" points="${s.pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}"/>`;
      g += s.pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.2" fill="${s.c}"/>`).join('');
      const last = s.pts.at(-1); let ly = Y(last[1]) + 4; while (used.some(u => Math.abs(u - ly) < 14)) ly += 14; used.push(ly);
      g += `<text x="${X(last[0]) + 8}" y="${ly}" font-size="11.5" font-weight="650" fill="${s.c}">${s.name}</text>`;
    }
    return `<svg viewBox="0 0 ${W_} ${H_}">${g}</svg>`;
  };
  const verdict = (yes, head, text) => `<div class="verdict ${yes ? 'yes' : 'no'}"><b>${yes ? '✓ ' : ''}${head}</b>${text}</div>`;
  const covs = ['cv_box', 'lgbm_all', 'lgbm_same', 'tabpfn'].map(m => T1[m].coverage);
  const t2b = Object.keys(EVD.t2.tabpfn_refit).map(Number).sort((a, b) => a - b);
  const t3n = Object.keys(T3).map(Number).sort((a, b) => a - b);
  const PANELS = [null,
    `<h3>Average patch at +2 s, held-out street</h3><div class="sub">each sized to 80% on validation · held-out coverage ${pc(Math.min(...covs))}–${pc(Math.max(...covs))} for all four</div>`
      + svgBars([{ label: 'Constant velocity', sub: '+ fixed box', v: T1.cv_box.area_m2, c: C_CV }, { label: 'LightGBM', sub: 'all rows, tuned', v: T1.lgbm_all.area_m2, c: C_LGB },
                 { label: 'LightGBM', sub: '5,000 rows, tuned', v: T1.lgbm_same.area_m2, c: C_LG2 }, { label: 'TabPFN', sub: '5,000 rows', v: T1.tabpfn.area_m2, c: C_TAB }], T1.cv_box.area_m2, 'm²')
      + verdict(false, 'Smallest patches, but formally no advantage', `TabPFN's patches are the smallest and grow most in crowds (×${f2(T1.tabpfn.crowded_over_open)} vs ×${f2(T1.lgbm_all.crowded_over_open)}). But every model landed at 77–78%, under the 78% floor we fixed, so by our rule this test does not count.`),
    `<h3>Error at +2 s around the rush-hour switch</h3><div class="sub">${EVD.t2_episodes} held-out episodes · refit every 1 s on the same rows</div>`
      + svgLines([{ name: 'TabPFN', c: C_TAB, pts: t2b.map(b => [b + 0.5, EVD.t2.tabpfn_refit[b]]) }, { name: 'LightGBM retrained', c: C_LGB, pts: t2b.map(b => [b + 0.5, EVD.t2.lgbm_retrained[b]]) },
                  { name: 'LightGBM frozen', c: C_LG2, pts: t2b.map(b => [b + 0.5, EVD.t2.lgbm_frozen[b]]) }],
                 { xticks: [-5, 0, 5, 10, 15], xlabel: 'seconds since rush hour began', ylabel: 'error (m)', yticks: [0.6, 0.8, 1.0, 1.2], ymin: 0.55, vline: 0, vlabel: 'rush hour' })
      + verdict(false, 'No advantage', 'The street’s rush hour is mild: all three recover within about 1 s, so this test cannot tell them apart. TabPFN is lowest throughout, but not faster to adapt.'),
    `<h3>Error at +2 s against amount of data</h3><div class="sub">held-out street · mean ± sd over 3 draws · LightGBM tuned for each size</div>`
      + svgLines([{ name: 'LightGBM', c: C_LGB, pts: t3n.map(n => [n, ...T3[n].lgbm]) }, { name: 'TabPFN', c: C_TAB, pts: t3n.map(n => [n, ...T3[n].tabpfn]) }],
                 { log: true, xticks: t3n, xfmt: v => v >= 1000 ? `${v / 1000}k` : v, xlabel: 'example rows', ylabel: 'error (m)', yticks: [0.8, 1.0, 1.2] })
      + verdict(true, 'TabPFN justified', `Lower error at every size: ${f2(T3[100].tabpfn[0])} vs ${f2(T3[100].lgbm[0])} m at 100 rows, ${f2(T3[5000].tabpfn[0])} vs ${f2(T3[5000].lgbm[0])} m at 5,000.`),
    `<h3>Error at +2 s on real people</h3><div class="sub">ETH and Hotel (Zurich) · held-out minutes · best LightGBM shown</div>`
      + svgBars(['eth', 'hotel'].filter(s => REAL[s]).flatMap(s => [{ label: s === 'eth' ? 'ETH' : 'Hotel', sub: 'LightGBM', v: REAL[s][best(s)]['2'][0], c: C_LGB, d: 2 },
                                                                    { label: '', sub: 'TabPFN', v: REAL[s].tabpfn['2'][0], c: C_TAB, d: 2 }]), 0.7, 'm')
      + verdict(true, 'More accurate on both', `Both gaps hold in a 95% bootstrap. On Hotel TabPFN's patches are also smaller (${f2(REAL.hotel.tabpfn['2'][2], 1)} vs ${f2(REAL.hotel[best('hotel')]['2'][2], 1)} m²); on ETH every model's patch covered too little (${pc(REAL.eth.tabpfn['2'][1])}–${pc(REAL.eth.lgbm_all['2'][1])}).`),
    `<h3>Honest limits</h3><ul><li>It is a simulation; real streets are messier.</li><li>In the episode you saw, coverage slips to about 76% after rush hour.</li>`
      + `<li>TabPFN did not adapt faster here, and its ranges sit at 77%, not 80%.</li><li>The robot follows a scripted route; planning around the patches is the next step.</li></ul>`
      + `<div class="verdict no"><b>Rules fixed before the run</b>Same rows, same features, held-out episodes, the baseline tuned too.</div>`,
    null];
  const OCAPS = [
    ['', 'Why TabPFN, and not something simpler', 'Three tests on held-out street episodes. Same rows and features for every model; the rules were fixed before the run.'],
    ['Test 1', 'Ranges you can trust', 'Each model’s patch is sized to 80% on validation. At the same coverage, a smaller patch leaves the robot more room.'],
    ['Test 2', 'Adapting to a switch', 'At rush hour TabPFN is re-fed the latest rows every second, and LightGBM is retrained every second on exactly the same rows.'],
    ['Test 3', 'Learning from little data', 'How accurate is each model with 50 to 5,000 example rows?'],
    ['Real pedestrians', 'Recorded people, not simulation', 'ETH and Hotel, two scenes from Zurich, on minutes the models never saw.'],
    ['', 'What this does not show', 'We state where TabPFN does not win.'],
    ['', 'Foresight', 'Calibrated ranges for every agent around a robot, from a few thousand example rows.'],
  ];
  // Test 1 close-up: the three models' boxes under the intro's pedestrian
  const zg = y => groundZ('pedestrian', y), Wv = (x, y, z = 0) => new THREE.Vector3(x, zg(y) + z, -y);
  const otag = (text, pos) => { const el = document.createElement('div'); el.className = 'pill tag'; el.innerHTML = text; const o = new CSS2DObject(el); o.position.copy(pos); scene.add(o); o.visible = false; return o; };
  const patch = (b, color, op, lift) => { const g = new THREE.BufferGeometry(), c = b.corners;
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(c.flatMap(([x, y]) => [x, zg(y) + lift, -y])), 3)); g.setIndex([0, 1, 2, 0, 2, 3]);
    const fill = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, depthWrite: false, side: THREE.DoubleSide }));
    const edge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(c.map(([x, y]) => new THREE.Vector3(x, zg(y) + lift + 0.01, -y))), new THREE.LineBasicMaterial({ color }));
    scene.add(fill, edge); fill.visible = edge.visible = false; return [fill, edge]; };
  // each tag on a different side of its own box: constant velocity south, LightGBM east, TabPFN north
  const side = { cv_box: (p, q) => p[1] - q[1], lgbm: (p, q) => q[0] - p[0], tabpfn: (p, q) => q[1] - p[1] };
  const P3 = [['cv_box', '#6f6a62', 0.2, 0.04, 'Constant velocity + box'], ['lgbm', C_LGB, 0.22, 0.05, 'LightGBM'], ['tabpfn', C_TAB, 0.34, 0.06, 'TabPFN']]
    .map(([k, c, op, lift, name]) => { const b = CMP[k], [x, y] = [...b.corners].sort(side[k])[0];
      return { parts: patch(b, c, op, lift), tag: otag(`${name} · this person: ${f2(b.area, 1)} m² · ${b.inside ? 'truth inside' : 'truth outside'}`, Wv(x, y, 0.45)) }; });
  const ring = mesh(new THREE.TorusGeometry(0.17, 0.05, 8, 24), new THREE.MeshBasicMaterial({ color: '#26262a' }), { x: FD.truth[0], y: FD.truth[1], z: zg(FD.truth[1]) + 0.09 });
  ring.rotation.x = -Math.PI / 2; scene.add(ring); ring.visible = false;
  const ringTag = otag('where they really were', Wv(FD.truth[0], FD.truth[1], 0.6));
  // cameras: an orbiting overview (panel on the right) and the Test 1 close-up
  const ov = VIEWS.overview, base = ov.pos.clone().sub(ov.target), shift = new THREE.Vector3(5.5, 0, 0);
  const orbit = (ot, sh) => { const a = -0.12 + 0.012 * ot, c = Math.cos(a), s_ = Math.sin(a);
    const tgt = ov.target.clone().add(sh ? shift : new THREE.Vector3()); return { target: tgt, pos: tgt.clone().add(new THREE.Vector3(base.x * c - base.z * s_, base.y, base.x * s_ + base.z * c)) }; };
  const close = (() => { const tgt = Wv(FD.median[0] + 3.4, FD.median[1] - 0.4, 0.2); return { target: tgt, pos: tgt.clone().add(new THREE.Vector3(-1.8, 14.5, 8.0)) }; })();
  const shot = (s, ot) => s === 1 ? close : orbit(ot, s >= 1 && s <= 5);
  outroSceneT = ot => { const s = stepOf2(ot); return s === 0 ? 20 + ot * 0.5 : s === 1 ? FD.k * D.dt : s === 2 ? 37 + (ot - OL[2]) : Math.min(T_END, 45 + (ot - OL[3]) * 0.4); };
  function stepOf2(ot) { return Math.max(0, OL.findIndex((b, i) => i + 1 < OL.length && ot >= b && ot < OL[i + 1])); }
  let oIdx = -1, oFrom = null;
  const cap = document.getElementById('caption'), panel = document.getElementById('panel');
  for (const id of ['info', 'bar', 'help']) document.getElementById(id).style.display = 'none';
  cap.style.display = 'block'; controls.enabled = false;
  outroUpdate = ot => {
    const s = Math.min(stepOf2(ot), OL.length - 2), ls = ot - OL[s];
    if (s !== oIdx) { oIdx = s; oFrom = { pos: camera.position.clone(), target: controls.target.clone() };
      document.getElementById('cap-step').textContent = OCAPS[s][0]; document.getElementById('cap-title').textContent = OCAPS[s][1]; document.getElementById('cap-text').textContent = OCAPS[s][2];
      panel.innerHTML = PANELS[s] || ''; }
    const e = ease(ls / 2.0), sh = shot(s, ot);
    camera.position.lerpVectors(oFrom.pos, sh.pos, e); controls.target.lerpVectors(oFrom.target, sh.target, e);
    panel.style.display = PANELS[s] && (s !== 1 || ls > 4.6) ? 'block' : 'none';
    P3.forEach((p, i) => { const on = s === 1 && ls > 0.8 + i * 1.1; p.parts.forEach(o => o.visible = on); p.tag.visible = on; });
    ring.visible = ringTag.visible = s === 1 && ls > 4.0;
    predShow = s === 1 ? 'none' : 'all';
    const ghostly = s === 1;
    for (const m of [leaf, leaf2, trunk]) { m.transparent = true; m.opacity = ghostly ? 0.15 : 1; m.depthWrite = !ghostly; }
  };
  predShow = 'all';
}

// frame-by-frame recording (tools/record_clip.py): draw intro time `it` exactly, nothing else moves
window.__introFrame = it => {
  introPaused = true; introT = it; t = introSceneT(it);
  update(); introUpdate(it); controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
};
// ?view=auto: the recorded scenario's camera, eased between shots: follow the robot out of the Café,
// overview, street level for the hard brake at the zebra, then overview for the jaywalker and rush hour
const AUTO = [[0, 'follow'], [9, 'overview'], [20, 'street'], [27, 'overview']];
let autoFrom = null, autoIdx = -1;
const autoShot = name => name === 'follow'
  ? (() => { const tg = robotV.g.position.clone().add(new THREE.Vector3(0, 1.2, 0)); return { target: tg, pos: tg.clone().add(followOffset) }; })()
  : { target: VIEWS[name].target.clone(), pos: VIEWS[name].pos.clone() };
window.__sceneFrame = s => {
  if (introOn) introEnd();
  playing = false; t = Math.min(s, T_END); lastRobot.copy(robotV.g.position);
  update();
  if (QP.get('view') === 'auto') {
    const i = AUTO.findLastIndex(a => s >= a[0]);
    if (i !== autoIdx) { autoIdx = i; autoFrom = { pos: camera.position.clone(), target: controls.target.clone() }; }
    const sh = autoShot(AUTO[i][1]), e = i === 0 ? 1 : ease((s - AUTO[i][0]) / 2.0);
    camera.position.lerpVectors(autoFrom.pos, sh.pos, e); controls.target.lerpVectors(autoFrom.target, sh.target, e);
  } else if (view === 'follow') { const d = robotV.g.position.clone().sub(lastRobot); camera.position.add(d); controls.target.add(d); }
  controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
};
window.__introLength = TL.at(-1);
window.__outroFrame = ot => {
  outPaused = true; outT = ot; t = outroSceneT(ot);
  update(); outroUpdate(ot); controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});
let last = performance.now();
const lastRobot = new THREE.Vector3();
renderer.setAnimationLoop(now => {
  const dtReal = Math.min((now - last) / 1000, 0.1); last = now;
  if (outroOn) {
    if (!outPaused) outT = Math.min(outT + dtReal * speed, OL.at(-1) - 0.001);
    t = outroSceneT(outT);
  } else if (introOn) {
    if (!introPaused) introT += dtReal * speed;
    if (introT >= TL.at(-1)) introEnd();
    else t = introSceneT(introT);
  } else if (playing) { t += dtReal * speed; if (t >= T_END) { t = T_END; playing = false; playBtn.textContent = '▶'; } }
  lastRobot.copy(robotV.g.position);
  update();
  if (introOn) introUpdate(introT);
  if (outroOn) outroUpdate(outT);
  if (view === 'follow') {                       // keep the camera's offset while the robot moves
    const d = robotV.g.position.clone().sub(lastRobot); camera.position.add(d); controls.target.add(d);
  }
  controls.update();
  renderer.render(scene, camera); labels.render(scene, camera);
});
</script>
